name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unittest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify there are no third-party runtime imports
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          allowed = {"__future__"}
          stdlib_ok = True
          bad = []
          for path in pathlib.Path("nginxforge").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] not in allowed and not a.name.startswith("nginxforge"):
                              bad.append(f"{path}: import {a.name}")
                  elif isinstance(node, ast.ImportFrom):
                      mod = (node.module or "").split(".")[0]
                      if node.level == 0 and mod and mod not in allowed and mod != "nginxforge":
                          bad.append(f"{path}: from {node.module}")
          print("\n".join(bad))
          print("non-stdlib/non-relative imports:", len(bad))
          PY

      - name: Run the test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: CLI smoke test
        run: |
          python -m nginxforge --version
          python -m nginxforge rules | tail -2
          python -m nginxforge gen --list
          python -m nginxforge audit tests/fixtures/bad.conf --summary || true

  audit-self:
    name: audit the bundled fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated templates must audit clean
        run: |
          set -e
          for t in reverse-proxy static spa websocket api-gateway load-balancer cache tls; do
            echo "--- $t"
            python -m nginxforge gen --template "$t" --audit >/dev/null
          done

      - name: Emit a SARIF report of the intentionally-bad fixture
        run: python -m nginxforge audit tests/fixtures/bad.conf --format sarif --output nginxforge.sarif

      - name: Upload SARIF to code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nginxforge.sarif
          category: nginxforge-demo

  package:
    name: build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
