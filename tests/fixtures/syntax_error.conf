# missing its terminating semicolon, and one block is never closed.

worker_processes  2;

events {
    worker_connections  1024;
}

http {
    server_tokens off
    server {
        listen 80;
        server_name broken.example.com;

        location / {
            root /var/www/html;
        }
    }
