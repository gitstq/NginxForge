# Intentionally bad configuration used by the test-suite.
# Every block below triggers at least one documented rule.

user  nginx;
worker_processes  4;

events {
    worker_connections  512;
}

http {
    include       mime.types;
    server_tokens on;
    autoindex     on;
    keepalive_timeout 300s;

    upstream backend {
        server 10.0.0.5;
    }

    server {
        listen       80;
        server_name  old.example.com;

        ssl_protocols  SSLv3 TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers    ALL:!aNULL:MD5;

        location / {
            root        /srv/app;
            alias       /srv/app;
            proxy_pass  http://backend/;
            try_files   $uri $uri/;
        }

        location /status {
            stub_status;
        }

        location /uploads/ {
            dav_methods            PUT DELETE;
            client_max_body_size   10m;
        }

        if ($http_user_agent ~* "badbot") {
            return 403;
        }
    }

    server {
        listen       80;
        server_name  old.example.com;
        location / {
            return 200 "dup";
        }
    }
}
